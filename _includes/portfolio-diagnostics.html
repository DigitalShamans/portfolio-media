<script>
  (() => {
    const flag = new URLSearchParams(location.search).get('diagnostics');
    const enabledKey = 'portfolio-diagnostics-enabled-v1';
    const reportKey = 'portfolio-diagnostics-pages-v1';
    let enabled = flag === '1';
    try {
      if (flag === '0') {
        sessionStorage.removeItem(enabledKey);
        sessionStorage.removeItem(reportKey);
        return;
      }
      enabled ||= sessionStorage.getItem(enabledKey) === '1';
      if (flag === '1') sessionStorage.setItem(enabledKey, '1');
    } catch {}
    if (!enabled) return;
    const pending = [];
    const observer = new AbortController();
    const libraryFile = /^(gsap|Flip|ScrollTrigger|ScrollSmoother|DrawSVGPlugin|MotionPathPlugin)\.min\.js$/;
    const settledLibraries = new WeakSet();

    function localFile(source) {
      if (!source) return;
      const url = new URL(source, document.baseURI);
      if (url.origin === location.origin) return url.pathname.split('/').pop();
    }

    function loadingLibraries() {
      const names = new Set();
      for (const script of document.scripts) {
        if (settledLibraries.has(script)) continue;
        const match = localFile(script.src)?.match(libraryFile);
        if (match && !window[match[1]]) names.add(match[1]);
      }
      return [...names];
    }

    const diagnostics = window.PortfolioDiagnostics = {
      pending, observer, enabledKey, reportKey, loadingLibraries, section: {{ include.section | jsonify }},
      style: {{ '/assets/portfolio-diagnostics.css?v=1' | relative_url | jsonify }}
    };
    for (const method of ['state', 'event', 'count', 'sample']) {
      diagnostics[method] = (...args) => {
        if (pending.length < 128) pending.push([method, args]);
      };
    }
    document.addEventListener('load', event => {
      if (event.target?.tagName !== 'SCRIPT') return;
      const file = localFile(event.target.src);
      if (!libraryFile.test(file)) return;
      settledLibraries.add(event.target);
      diagnostics.event('libraries', 'loaded', { file });
    }, { capture: true, signal: observer.signal });
    window.addEventListener('error', event => {
      const script = event.target?.tagName === 'SCRIPT' ? event.target : null;
      const file = localFile(script?.src || event.filename);
      if (libraryFile.test(file)) {
        if (script) settledLibraries.add(script);
      } else if (!/^(career-timeline|gallery-viewer|gallery-desktop-panels|gallery-mobile-scroll|gallery-page-scroll|gallery-map|portfolio-effects|portfolio-tile-preview|portfolio-diagnostics|about-entry)\.js$/.test(file)) {
        return;
      }
      diagnostics.event('scripts', script ? 'load failed' : 'execution failed', {
        file, line: event.lineno || undefined
      });
    }, { capture: true, signal: observer.signal });
    const script = document.createElement('script');
    script.src = {{ '/assets/portfolio-diagnostics.js?v=7' | relative_url | jsonify }};
    script.addEventListener('error', () => {
      const message = document.createElement('p');
      message.textContent = 'Website diagnostics could not load. Reload to retry.';
      if (document.body) document.body.prepend(message);
      else document.addEventListener('DOMContentLoaded', () => document.body.prepend(message), { once: true });
    }, { once: true });
    document.head.append(script);
  })();
</script>
