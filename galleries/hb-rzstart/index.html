  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Environment art by Digital Shamans for Hard Bullet.">
  <title>Hard Bullet - RZ Start | Digital Shamans</title>
  <link rel="stylesheet" href="../gallery.css">
  <style>
    .gallery-access { max-width: 34rem; padding-block: 2rem; }
    .gallery-access h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
    .gallery-access form { display: grid; gap: .7rem; max-width: 24rem; margin-inline: auto; }
    .gallery-access input, .gallery-access button {
      width: 100%;
      min-height: 44px;
      padding: .5rem .8rem;
      border: 1px solid var(--border);
      border-radius: .35rem;
      font: inherit;
    }
    .gallery-access input { background: #101010; color: var(--text); }
    .gallery-access button { background: var(--accent); color: #191919; font-weight: 700; cursor: pointer; }
    .gallery-access button:disabled { opacity: .5; cursor: default; }
    .gallery-access p { min-height: 1.55em; margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell">
      <span class="wordmark">Digital Shamans</span>
      <a class="back" href="https://digitalshamans.co.uk/">Back to portfolio</a>
    </div>
  </header>

  <main id="gallery-access" class="shell gallery-access">
    <header class="intro">
      <h1>Hard Bullet - RZ Start</h1>
    </header>
    <form id="gallery-access-form" method="post">
      <label for="gallery-password">Gallery password</label>
      <input id="gallery-password" type="password" autocomplete="current-password" aria-describedby="access-message" required>
      <button type="submit" disabled>Unlock gallery</button>
      <p id="access-message" role="status"></p>
    </form>
    <noscript><p>Enable JavaScript to unlock the gallery.</p></noscript>
  </main>

    const form = document.querySelector('#gallery-access-form');
    const password = document.querySelector('#gallery-password');
    const submit = form.querySelector('button');
    const message = document.querySelector('#access-message');

    function decodeBase64(value) {
      return Uint8Array.from(atob(value), character => character.charCodeAt(0));
    }

    async function decryptGallery(value) {
      const material = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveKey'],
      );
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 600000 },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt'],
      );
      const decoded = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, encryptedGallery);
      return new TextDecoder().decode(decoded);
    }

    function loadScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = source;
        script.addEventListener('load', resolve, { once: true });
        script.addEventListener('error', reject, { once: true });
        document.body.append(script);
      });
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (submit.disabled) return;
      submit.disabled = true;
      message.textContent = 'Checking password…';

      let markup;
      try {
        markup = await decryptGallery(password.value);
      } catch (error) {
        message.textContent = error.name === 'OperationError'
          ? 'Incorrect password.'
          : 'The gallery could not be unlocked. Please reload to try again.';
        submit.disabled = false;
        password.focus();
        password.select();
        return;
      }

      password.value = '';
      const template = document.createElement('template');
      template.innerHTML = markup;
      document.querySelector('#gallery-access').replaceWith(template.content);
      try {
        await loadScript('../gallery-data.js?v=2');
        await loadScript('../gallery-viewer.js');
      } catch {
        document.querySelector('#gallery-status').textContent =
          'The gallery could not be loaded. Please reload to try again.';
      }
    });

    if (globalThis.crypto?.subtle) {
      submit.disabled = false;
    } else {
      message.textContent = 'Open this gallery in a browser with Web Crypto support.';
    }
  </script>
