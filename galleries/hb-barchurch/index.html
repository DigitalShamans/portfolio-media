<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Environment art by Digital Shamans for Hard Bullet.">
  <title>Hard Bullet - Bar &amp; Church | Digital Shamans</title>
  {% include site-favicon.html %}
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v=5">
  <link rel="stylesheet" href="../gallery.css?v=5">
</head>
<body>
  {% include site-header.html %}

  <main class="shell">
    <div class="gallery-content">
      <header class="intro">
        <h1>Hard Bullet - Bar &amp; Church</h1>
        <p class="description">Environment art by Digital Shamans for Hard Bullet.</p>
      </header>
      <p id="gallery-status" role="status">Loading gallery…</p>
      <section class="gallery" aria-label="Bar &amp; Church screenshots"></section>
    </div>
    <footer class="site-footer"><a class="back" href="{{ '/' | relative_url }}#recent-work">Back to portfolio</a></footer>
  </main>

  <dialog id="viewer" aria-label="4K image viewer">
    <div id="viewer-frame" class="viewer-frame">
      <div id="stage" class="stage" tabindex="0" aria-label="Image viewing area">
        <img id="original" alt="" draggable="false">
      </div>
      <div class="viewer-arrows" role="group" aria-label="Side navigation">
        <button id="previous-side" type="button" aria-label="Previous image (left)">←</button>
        <button id="next-side" type="button" aria-label="Next image (right)">→</button>
      </div>
      <div class="viewer-bar">
        <div class="viewer-group">
          <button id="previous" type="button" aria-label="Previous image">←</button>
          <output id="counter" class="counter" aria-live="polite"></output>
          <button id="next" type="button" aria-label="Next image">→</button>
        </div>
        <div class="viewer-group">
          <button id="zoom" type="button" disabled>100%</button>
          <button id="fullscreen" type="button" hidden>Fullscreen</button>
          <button id="close" type="button" autofocus>Close</button>
        </div>
      </div>
      <p id="status" class="status" role="status" hidden></p>
    </div>
  </dialog>

  <script src="../gallery-data.js?v=3"></script>
  <script src="../gallery-viewer.js?v=2"></script>
</body>
</html>
