name: Atrium GSAP scroll checks

on:
  push:
    branches: [qa/atrium-gsap-scroll-2026-11-24]

permissions:
  contents: read

jobs:
  scroll-and-viewer:
    if: github.ref == 'refs/heads/qa/atrium-gsap-scroll-2026-11-24'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test driver
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/atrium-browser" playwright@1.62.1
      - name: Record source and browser
        run: |
          git rev-parse HEAD
          /usr/bin/google-chrome --version
      - name: Run offline map, mobile scrolling and diagnostics regressions
        run: node --test .github/tests/gallery-map.test.cjs .github/tests/gallery-mobile-scroll.test.cjs .github/tests/portfolio-diagnostics.test.cjs .github/tests/gallery-arrival.test.cjs
      - name: Run scroll motion and fullscreen browser regressions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/atrium-browser/node_modules"
          node --test --test-name-pattern='ScrollSmoother|Atrium|opening diagnostics|first desktop wheel|fullscreen desktop|fullscreen touch swipes|pinch and pan keep|comparison hover' .github/tests/gallery-delivery.browser.test.cjs
