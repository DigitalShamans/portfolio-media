name: Portfolio checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate portfolio
        uses: ./.github/actions/validate-portfolio
