name: Safari and Chrome desktop typography captures

on:
  push:
    branches: [qa/desktop-typography-2026-11-25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Native browser typography captures
    if: github.ref == 'refs/heads/qa/desktop-typography-2026-11-25'
    runs-on: macos-15-intel
    timeout-minutes: 8
    env:
      PORTFOLIO_SOURCE_SHA: bac778a3babe72dd032209228d03ffa99a604676
      TYPOGRAPHY_CAPTURE_MODE: chrome
      TYPOGRAPHY_TEST_BUDGET_SECONDS: '180'
      CHROME_BINARY: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          lfs: false
      - name: Record installed browser versions
        run: |
          mkdir -p artifacts/desktop-typography/chrome
          sw_vers > artifacts/desktop-typography/macos-version.txt
          if test "$TYPOGRAPHY_CAPTURE_MODE" != chrome; then
            mkdir -p artifacts/desktop-typography/safari
            /usr/bin/safaridriver --version > artifacts/desktop-typography/safari/safaridriver-version.txt
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist > artifacts/desktop-typography/safari/safari-version.txt
          fi
          test -x "$CHROME_BINARY"
          "$CHROME_BINARY" --version > artifacts/desktop-typography/chrome/chrome-version.txt
          typography_chromedriver="${CHROMEWEBDRIVER:+$CHROMEWEBDRIVER/chromedriver}"
          if test -z "$typography_chromedriver"; then
            typography_chromedriver="$(command -v chromedriver)"
          fi
          test -x "$typography_chromedriver"
          "$typography_chromedriver" --version > artifacts/desktop-typography/chrome/chromedriver-version.txt
          printf 'TYPOGRAPHY_CHROMEDRIVER=%s\n' "$typography_chromedriver" >> "$GITHUB_ENV"
      - name: Enable native Safari automation
        if: env.TYPOGRAPHY_CAPTURE_MODE != 'chrome'
        run: sudo /usr/bin/safaridriver --enable
      - name: Capture Safari at six resolutions
        if: env.TYPOGRAPHY_CAPTURE_MODE != 'chrome'
        env:
          TYPOGRAPHY_BROWSER: safari
          TYPOGRAPHY_WEBDRIVER_URL: http://127.0.0.1:4444
          TYPOGRAPHY_OUTPUT_DIR: artifacts/desktop-typography/safari
        run: |
          /usr/bin/safaridriver -p 4444 > "$TYPOGRAPHY_OUTPUT_DIR/safaridriver.log" 2>&1 &
          typography_driver_pid=$!
          trap 'kill "$typography_driver_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, time, urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(os.environ['TYPOGRAPHY_WEBDRIVER_URL'] + '/status', timeout=2) as response:
                      print(response.read().decode())
                  break
              except Exception:
                  if attempt == 19:
                      raise
                  time.sleep(1)
          PY
          python3 .github/scripts/desktop-typography-safari.py
      - name: Capture headless Google Chrome at six resolutions
        if: ${{ !cancelled() && env.TYPOGRAPHY_CAPTURE_MODE != 'safari' }}
        env:
          TYPOGRAPHY_BROWSER: chrome
          TYPOGRAPHY_CHROME_HEADLESS: '1'
          TYPOGRAPHY_WEBDRIVER_URL: http://127.0.0.1:4445
          TYPOGRAPHY_OUTPUT_DIR: artifacts/desktop-typography/chrome
        run: |
          "$TYPOGRAPHY_CHROMEDRIVER" --port=4445 > "$TYPOGRAPHY_OUTPUT_DIR/chromedriver.log" 2>&1 &
          typography_driver_pid=$!
          trap 'kill "$typography_driver_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, time, urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(os.environ['TYPOGRAPHY_WEBDRIVER_URL'] + '/status', timeout=2) as response:
                      print(response.read().decode())
                  break
              except Exception:
                  if attempt == 19:
                      raise
                  time.sleep(1)
          PY
          python3 .github/scripts/desktop-typography-safari.py
      - name: Publish capture summaries
        if: always()
        run: |
          for typography_report in artifacts/desktop-typography/{safari,chrome}/report.md; do
            if test -f "$typography_report"; then
              cat "$typography_report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Keep native browser captures and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-typography-safari-chrome
          path: artifacts/desktop-typography/
          if-no-files-found: error
          retention-days: 7
