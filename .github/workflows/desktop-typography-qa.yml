name: Safari desktop typography captures

on:
  push:
    branches: [qa/desktop-typography-2026-11-25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Actual Safari typography captures
    if: github.ref == 'refs/heads/qa/desktop-typography-2026-11-25'
    runs-on: macos-15
    timeout-minutes: 8
    env:
      SAFARI_WEBDRIVER_URL: http://127.0.0.1:4444
      SAFARI_OUTPUT_DIR: artifacts/safari-typography
      PORTFOLIO_SOURCE_SHA: 7cb8f87feac62e6a7abf31643f41f32c919dcad9
      SAFARI_TEST_BUDGET_SECONDS: '300'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          lfs: false
      - name: Record Safari version
        run: |
          mkdir -p "$SAFARI_OUTPUT_DIR"
          sw_vers > "$SAFARI_OUTPUT_DIR/macos-version.txt"
          /usr/bin/safaridriver --version > "$SAFARI_OUTPUT_DIR/safaridriver-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Applications/Safari.app/Contents/Info.plist > "$SAFARI_OUTPUT_DIR/safari-version.txt"
      - name: Enable native Safari automation
        run: sudo /usr/bin/safaridriver --enable
      - name: Capture published page at several resolutions
        run: |
          /usr/bin/safaridriver -p 4444 > "$SAFARI_OUTPUT_DIR/safaridriver.log" 2>&1 &
          typography_driver_pid=$!
          trap 'kill "$typography_driver_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4444/status', timeout=2) as response:
                      print(response.read().decode())
                  break
              except Exception:
                  if attempt == 19:
                      raise
                  time.sleep(1)
          PY
          python3 .github/scripts/desktop-typography-safari.py
      - name: Publish capture summary
        if: always()
        run: |
          if test -f "$SAFARI_OUTPUT_DIR/report.md"; then
            cat "$SAFARI_OUTPUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep Safari captures and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-desktop-typography
          path: artifacts/safari-typography/
          if-no-files-found: error
          retention-days: 7
