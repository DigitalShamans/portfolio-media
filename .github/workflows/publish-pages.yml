name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      workflow_source: ${{ steps.source.outputs.workflow_source }}
    steps:
      - name: Check Pages publishing source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [[ "$mode" == workflow ]]; then
            echo 'workflow_source=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.source.outputs.workflow_source == 'true'
        with:
          persist-credentials: false
      - name: Validate public gallery manifests
        if: steps.source.outputs.workflow_source == 'true'
        run: |
          node --test .github/tests/public-gallery-routes.test.cjs .github/tests/gallery-resolution.test.cjs .github/tests/gallery-mobile-scroll.test.cjs
          node .github/scripts/validate-public-galleries.cjs
      - name: Test gallery publication cleanup
        if: steps.source.outputs.workflow_source == 'true'
        run: python3 -m unittest discover --start-directory .github/tests --pattern 'test_prune*.py'
      - uses: actions/configure-pages@v5
        if: steps.source.outputs.workflow_source == 'true'
      - name: Generate gallery asset versions
        if: steps.source.outputs.workflow_source == 'true'
        run: python3 .github/scripts/generate-gallery-asset-versions.py
      - name: Build with Jekyll
        if: steps.source.outputs.workflow_source == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Prune unpublished gallery images
        if: steps.source.outputs.workflow_source == 'true'
        run: |
          # Jekyll's build container creates its output as root.
          sudo chown -R "$(id -u):$(id -g)" ./_site/galleries
          python3 .github/scripts/prune-unpublished-gallery-images.py ./_site --apply
      - name: Validate homepage gallery links
        if: steps.source.outputs.workflow_source == 'true'
        run: python3 .github/scripts/validate-homepage-gallery-links.py ./_site
      - uses: actions/upload-pages-artifact@v4
        if: steps.source.outputs.workflow_source == 'true'

  deploy:
    needs: build
    if: needs.build.outputs.workflow_source == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
